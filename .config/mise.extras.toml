# your `env/dev.local.sh` should set MISE_ENV=dev,extras to include these tools

[tools]
# iloveitaly-owned packages bypass the repo 14d minimum_release_age gate
"pypi:aiautocommit" = { version = "latest", minimum_release_age = "0s" }
"pypi:uv-development-toggle" = { version = "latest", minimum_release_age = "0s" }
"pypi:llm-ide-rules" = { version = "latest", minimum_release_age = "0s" }
# git hook manager
"lefthook" = "latest"
# not really an extra, since this is used on CI, but the CI version is installed/used via a GHA
"1password-cli" = "latest"
# great for docker image exploration
"dive" = "latest"
# for the VSC just extension
"github:terror/just-lsp" = "latest"
# for some of the python process inspection/kill utilities
"pypi:jc" = "latest"
# "github:dmtrKovalenko/odiff" = "latest"
