min_version = "2026.10.13"

# packages that are *not* required in production, but are required for development and ci should be included here

# - `pypi` mise backend actually installs tools via `uv tool install` which means the tool can be shared across projects
# - if a package requires access to the venv of the project itself, it should be in `dev` or `debugging-extras` if it's
#   only for local development/CI.

[tools]

########
# Core #
########
just = "latest"
direnv = "latest"

#############
# Utilities #
#############

# mise's "latest" semver sort picks 3.0.0+commit.5d74685 over 3.0.0+commit.43c3619 because of the +commit suffix
"github:peterldowns/localias" = "3.0.0+commit.43c3619"
"github:gitleaks/gitleaks" = "latest"
actionlint = "latest"
yamllint = "latest"
pinact = "latest"
"jq" = "latest"
"mprocs" = "latest"
"fd" = "latest"
"yq" = "latest"
"watchexec" = "latest"
"github:chmln/sd" = "latest"
"ast-grep" = "latest"
"github:dmtrKovalenko/odiff" = "latest"
