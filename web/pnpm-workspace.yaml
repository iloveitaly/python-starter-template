allowBuilds:
  '@clerk/shared': true
  '@sentry/cli': true
  core-js: true
  esbuild: true
  protobufjs: true
  '@tailwindcss/oxide': true
  # native build scripts pulled in through clerk-js's optional react-native/solana peers,
  # none of which are used by the browser bundle
  browser-tabs-lock: false
  bufferutil: false
  utf-8-validate: false
engineStrict: true
minimumReleaseAgeExclude:
  - react-router-devtools@6.2.3
  - '@clerk/localizations@4.14.1'
  - '@clerk/shared@4.27.0'
