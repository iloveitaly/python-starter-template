# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
version: 3
# yamllint requires two spaces before a comment
separator: "  # "
min_age:
  value: 30
rules:
  # tracked on master on purpose; pinact will not pin a branch ref
  - ignore: true
    conditions:
      - expr: |
          ActionRepoOwner == "iloveitaly" && ActionVersion == "master"
