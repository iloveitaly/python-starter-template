name: Build & Publish

on:
  workflow_dispatch:
    # Actions > Build & Publish> Run workflow
    # allow ssh access to be enabled via the GH actions UI
    inputs:
      debug_enabled:
        type: boolean
        # https://github.com/marketplace/actions/debugging-with-tmate
        description: "Run with tmate enabled for ssh debugging"
        required: false
        default: false
  push:
    branches: [master]
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # run `just secrets_ci_grant-github-actions` to grant CI access to 1Password
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  # for the gh-cli
  GH_TOKEN: ${{ github.token }}

  # required otherwise github api calls are rate limited
  # mise, and other tools, use this token to authenticate and eliminate rate limits
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # a important design goal is to avoid custom configuration in CI. This enables tests to be run in a CI-like environment
  # locally, making it easy to replicate CI issues. This is one of the few CI-specific configuration changes since
  # the host where services are located is truly unique to the CI environment.
  DATABASE_HOST: postgres.localhost
  REDIS_HOST: redis.localhost
  SMTP_HOST: mailpit.localhost
  GEOIP_HOST: geoip.localhost

  # https://github.com/Textualize/rich/issues/2769
  COLUMNS: 120

  # localias is started by a GHA, so we need to point it to our customized config file
  LOCALIAS_CONFIGFILE: tmp/localias.yml

  # dev tools must be installed in CI as well
  MISE_ENV: dev

  # extra Clerk users the test suite must not delete, see app/factories/constants.py
  # a repository variable rather than a secret: these are just emails, and masked values are unreadable in logs
  CLERK_PRESERVED_USER_EMAILS: ${{ vars.CLERK_PRESERVED_USER_EMAILS }}

jobs:
  # NOTE there is no global timeout minutes, so we need to set it on each job :/

  app:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # we need the full history for gitleaks to work properly, otherwise it will just scan the latest commit which is not very useful
          fetch-depth: 0
      - uses: ./.github/actions/common-setup
        timeout-minutes: 3
      - name: Cache Trivy databases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-${{ runner.arch }}-trivy-${{ hashFiles('.config/mise.dev.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-trivy-
      - run: just dev_lint
      - uses: iloveitaly/github-action-localias@master
        with:
          chrome: true
      - run: just docker_up --fast
      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('uv.lock', '.service-versions') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-
      - run: just py_setup
      - run: just py_lint
      - run: just db_migrate
      - run: just db_lint
      - run: just py_test

      # NOTE one important problem with `detached` is if something fails, the github environment does seem to get wiped
      # for instance GITHUB_ENV, seems to be cleared out.
      - uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3.24
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with: { detached: true }

      - name: Upload test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # playwright traces, screenshots, logs, etc
          # traces and pngs allow us to debug e2e test failures
          name: test-results
          # NOTE if direnv sourcing fails, this var will not be set and it will fail
          path: |
            ${{ env.TEST_RESULTS_DIRECTORY }}
            ${{ env.PLAYWRIGHT_VISUAL_SNAPSHOT_DIRECTORY }}

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/common-setup
        timeout-minutes: 3
      - run: just js_setup
      - run: just js_lint
      - run: just js_test

  # NOTE disabled for now; we are going to switch to railpack soon
  # https://railpack.com/guides/running-railpack-in-production
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [web, app]
    # if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    if: false
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/common-setup
        timeout-minutes: 1
      # login before building so previous build image can be pulled for nixpacks cache
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: just build
      - run: just build_push
