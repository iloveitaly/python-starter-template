# NOTE: for development use only, do not run this compose in production!
# ports are not exposed, instead dynamic orb domains are used
# exception: chrome publishes a localhost websocket so host pytest can attach
services:
  # port 5432
  postgres:
    # NOTE lock this value to the specific version you use in production
    # https://hub.docker.com/_/postgres/
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${CI:+5432}:5432
    volumes:
      - app_postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # Use a 24-hour interval trick to disable ongoing background healthchecks after the container reaches a healthy state.
      # This reduces local CPU overhead from pinging the container repeatedly during development.
      interval: 24h
      # Rapid checks every second during initial boot
      start_interval: 1s
      start_period: 10s
      timeout: 5s
      retries: 3

  # port 6379
  redis:
    # NOTE you'll probably need to drop this value for your production environment which will lag edge releases
    image: redis:8
    restart: unless-stopped
    ports:
      - ${CI:+6379}:6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      # Use a 24-hour interval trick to disable ongoing background healthchecks after the container reaches a healthy state.
      # This reduces local CPU overhead from pinging the container repeatedly during development.
      interval: 24h
      # Rapid checks every second during initial boot
      start_interval: 1s
      start_period: 5s
      timeout: 3s
      retries: 3

  # SMTP sinkhole for easily viewing email in development
  # web ui: 8025
  # smtp: 1025
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - ${CI:+1025}:1025
      - ${CI:+8025}:8025
    volumes:
      - mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # port 8080
  # IP geolocation JSON API (MaxMind GeoLite2)
  # https://github.com/observabilitystack/geoip-api
  geoip:
    image: ghcr.io/observabilitystack/geoip-api:latest
    restart: unless-stopped
    ports:
      - ${CI:+8080}:8080
    healthcheck:
      # Image ships with curl and /actuator/health
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      # Use a 24-hour interval trick to disable ongoing background healthchecks after the container reaches a healthy state.
      # This reduces local CPU overhead from pinging the container repeatedly during development.
      interval: 24h
      # Rapid checks every second during initial boot
      start_interval: 1s
      start_period: 15s
      timeout: 5s
      retries: 5

  # Playwright Chromium shared by macOS, Linux, and CI.
  # The image relays loopback 80/443 to host localias and disables QUIC.
  chrome:
    image: ghcr.io/iloveitaly/playwright-loophole:latest
    # native Linux, including CI, does not define host.docker.internal; Docker Desktop and OrbStack already do
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # chromium crashes under the default 64mb /dev/shm
    ipc: host
    shm_size: 1gb
    environment:
      TZ: ${TZ:?TZ is unset, env/all.sh exports it}
      # root.crt is mode 0600, so the host passes the PEM instead of a bind mount
      LOOPHOLE_CA_CERT_B64: ${LOCALIAS_CA_B64:?LOCALIAS_CA_B64 is unset, run compose through just}
    ports:
      - "127.0.0.1:${PLAYWRIGHT_CHROME_PORT}:3000"
    healthcheck:
      # TCP open is enough; the server speaks websockets on this port
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mailpit_data:
  # NOTE redis data is not persisted, assumed to be ephemeral
  app_postgres_data:
