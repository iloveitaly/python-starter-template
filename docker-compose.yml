# NOTE: for development use only, do not run this compose in production!
# ports are not exposed, instead dynamic orb domains are used
# exception: chrome publishes a localhost websocket so host pytest can attach
services:
  # port 5432
  postgres:
    # NOTE lock this value to the specific version you use in production
    # https://hub.docker.com/_/postgres/
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${CI:+5432}:5432
    volumes:
      - app_postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # Use a 24-hour interval trick to disable ongoing background healthchecks after the container reaches a healthy state.
      # This reduces local CPU overhead from pinging the container repeatedly during development.
      interval: 24h
      # Rapid checks every second during initial boot
      start_interval: 1s
      start_period: 10s
      timeout: 5s
      retries: 3

  # port 6379
  redis:
    # NOTE you'll probably need to drop this value for your production environment which will lag edge releases
    image: redis:8
    restart: unless-stopped
    ports:
      - ${CI:+6379}:6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      # Use a 24-hour interval trick to disable ongoing background healthchecks after the container reaches a healthy state.
      # This reduces local CPU overhead from pinging the container repeatedly during development.
      interval: 24h
      # Rapid checks every second during initial boot
      start_interval: 1s
      start_period: 5s
      timeout: 3s
      retries: 3

  # SMTP sinkhole for easily viewing email in development
  # web ui: 8025
  # smtp: 1025
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - ${CI:+1025}:1025
      - ${CI:+8025}:8025
    volumes:
      - mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # port 8080
  # IP geolocation JSON API (MaxMind GeoLite2)
  # https://github.com/observabilitystack/geoip-api
  geoip:
    image: ghcr.io/observabilitystack/geoip-api:latest
    restart: unless-stopped
    ports:
      - ${CI:+8080}:8080
    healthcheck:
      # Image ships with curl and /actuator/health
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      # Use a 24-hour interval trick to disable ongoing background healthchecks after the container reaches a healthy state.
      # This reduces local CPU overhead from pinging the container repeatedly during development.
      interval: 24h
      # Rapid checks every second during initial boot
      start_interval: 1s
      start_period: 15s
      timeout: 5s
      retries: 5

  # Playwright Chromium shared by macOS, Linux, and CI.
  # The image tag is pinned to the python playwright package.
  chrome:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    # chromium crashes under the default 64mb /dev/shm
    ipc: host
    shm_size: 2gb
    user: pwuser
    working_dir: /home/pwuser
    environment:
      TZ: UTC
      # browsers are baked into the image; npx must not download a second copy
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    command:
      - npx
      - -y
      - playwright@1.63.0
      - run-server
      - --port
      - "3000"
      - --host
      - 0.0.0.0
    ports:
      - "127.0.0.1:${PLAYWRIGHT_CHROME_PORT}:3000"
    healthcheck:
      # TCP open is enough; the server speaks websockets on this port
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Chrome resolves *.localhost to loopback and ignores /etc/hosts.
  # Share chrome's netns and forward loopback 80/443 to host localias.
  chrome-localhost-proxy:
    image: alpine/socat:1.8.0.0
    network_mode: service:chrome
    depends_on:
      - chrome
    volumes:
      - ./infra/chrome-localhost-proxy.sh:/chrome-localhost-proxy.sh:ro
    entrypoint: ["/bin/sh", "/chrome-localhost-proxy.sh"]

volumes:
  mailpit_data:
  # NOTE redis data is not persisted, assumed to be ephemeral
  app_postgres_data:
